# =============================================
# Concept Clarity - Application Configuration
# =============================================

# Server Configuration
server.port=8080

# =============================================
# Database Configuration (H2 In-Memory)
# =============================================
spring.datasource.url=jdbc:h2:mem:concept_clarity;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# AI API Configuration — Groq (FREE tier)
# =============================================
# Get your FREE API key at: https://console.groq.com
# No credit card required! Sign up takes 2 minutes.
#
# Set the key as an environment variable:
#   Mac/Linux:  export GROQ_API_KEY=gsk_xxxxxxxxxxxx
#   Windows:    set GROQ_API_KEY=gsk_xxxxxxxxxxxx
#
ai.api.key=${GROQ_API_KEY}
ai.api.url=https://api.groq.com/openai/v1/chat/completions

# Model options (all FREE on Groq):
#   llama-3.3-70b-versatile   <- recommended (best quality)
#   llama-3.1-8b-instant      <- fastest response
#   mixtral-8x7b-32768        <- large 32k context window
ai.api.model=llama-3.3-70b-versatile

ai.api.max-tokens=2048
ai.api.timeout-seconds=30

# =============================================
# CORS Configuration
# =============================================
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:5173,${FRONTEND_URL:https://concept-clarity.vercel.app}

# =============================================
# Logging
# =============================================
logging.level.com.conceptclarity=INFO
logging.level.org.springframework.web=WARN

# =============================================
# External APIs (Optional)
# =============================================
youtube.api.key=${YOUTUBE_API_KEY:}
unsplash.api.key=${UNSPLASH_API_KEY:}
